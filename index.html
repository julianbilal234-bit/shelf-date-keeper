<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f5c4c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shelf Date Keeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: stockroom ledger — a sticky scan bar on top, section tabs, then the dated item list (table on wide screens, shelf tags on phones). */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#15302a; --muted:#5d6f69; --line:#d9e0dc;
  --accent:#0f5c4c; --accent-ink:#ffffff; --tag:#f6d34a; --tag-ink:#2a2300;
  --bad:#b4232c; --bad-bg:#fbe7e8; --warn:#9a5b00; --warn-bg:#fff1d6; --good:#1f6b3a; --good-bg:#e3f3e8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#16211e; --ink:#e4ece8; --muted:#97a8a2; --line:#2a3834;
  --accent:#4fbfa5; --accent-ink:#06201a; --tag:#e9c53b; --tag-ink:#231c00;
  --bad:#ff7b80; --bad-bg:#3a1a1c; --warn:#f2b552; --warn-bg:#36290f; --good:#6fd291; --good-bg:#15301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#e4ece8; --muted:#97a8a2; --line:#2a3834;
  --accent:#4fbfa5; --accent-ink:#06201a; --tag:#e9c53b; --tag-ink:#231c00;
  --bad:#ff7b80; --bad-bg:#3a1a1c; --warn:#f2b552; --warn-bg:#36290f; --good:#6fd291; --good-bg:#15301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);border-radius:8px;padding:6px 10px;min-width:84px;text-align:left;border:0;cursor:pointer;color:inherit}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1}
.stat span{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
.stat.alert b{color:var(--tag)}

/* scan / add panel */
.scan{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.scan .wrap{padding-block:12px}
.scan form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 70px auto;gap:8px;align-items:end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{width:100%;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.bc{display:flex;gap:6px}
.bc input{min-width:0;flex:1}
#f-barcode{font-family:var(--f-mono);letter-spacing:.04em}
.iconbtn[hidden]{display:none}
.iconbtn{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.btn{height:42px;border:0;border-radius:6px;padding:0 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{height:32px;padding:0 10px;font-size:.85rem}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px;min-height:1.2em}
.hint.ok{color:var(--good)} .hint.err{color:var(--bad)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:center}
.tab .c{font-size:.75rem;background:var(--bg);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .c{background:color-mix(in srgb,var(--bg) 20%,transparent);color:inherit}
.tab.add{border-style:dashed;color:var(--accent)}
.newsec{display:flex;gap:6px;align-items:center;flex:none}
.newsec input{height:34px;border:1px solid var(--accent);border-radius:999px;padding:0 12px;background:var(--surface);width:160px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 12px 0 36px}
.search svg{position:absolute;left:10px;top:10px;width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-weight:600}
.bar select{height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}

.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:.01em}
.sechead .meta{color:var(--muted);font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0}

/* table */
.tablebox{overflow-x:auto;margin-block:10px 30px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.code{font-family:var(--f-mono);font-size:.86rem;color:var(--muted)}
td.desc{font-weight:500}
td.desc .ex{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.sec-lbl{font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;border-radius:4px;padding:3px 8px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.good{background:var(--good-bg);color:var(--good)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.rowact button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:.82rem}
.rowact button.del{color:var(--bad)}
.rowact button.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
tr.editing td{background:color-mix(in srgb,var(--tag) 16%,var(--surface))}
td input,td select{width:100%;height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 8px;min-width:0}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
footer{color:var(--muted);font-size:.8rem;padding-block:0 30px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* coming-up panel */
.due{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.due-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.due h3{margin:0;font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.due-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem}
.due-row .pill{justify-self:start}
.due-names{min-width:0;overflow-wrap:anywhere}
.due-note{font-size:.82rem;color:var(--muted)}
.due-days{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.due-days .chip{padding:4px 9px;font-size:.8rem}
@media (max-width:520px){.due-row{grid-template-columns:1fr;gap:3px}}

/* phones: shelf-tag cards */
@media (max-width:760px){
  .scan form{grid-template-columns:1fr 1fr}
  .scan .f-bc,.scan .f-desc{grid-column:1/-1}
  .scan .f-qty{grid-column:1}
  .scan .f-go{grid-column:2}
  .scan .f-go .btn{width:100%}
  .scan{position:static}
  .tablebox{background:transparent;border:0;overflow:visible}
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tag);border-radius:8px;margin-bottom:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  tr.s-bad{border-left-color:var(--bad)} tr.s-warn{border-left-color:var(--warn)} tr.s-good{border-left-color:var(--good)}
  td{border:0;padding:0}
  td.desc{grid-column:1;font-size:1.02rem}
  td.st{grid-column:2;grid-row:1;text-align:right}
  td.code{grid-column:1/-1}
  td.exp{grid-column:1;font-size:.88rem}
  td.qty{grid-column:2;text-align:right;font-size:.88rem}
  td.qty::before{content:"Qty ";color:var(--muted)}
  td.secc{grid-column:1/-1}
  td.act{grid-column:1/-1;margin-top:6px}
  td.act .rowact{justify-content:flex-start}
  tr.editing{grid-template-columns:1fr}
  tr.editing td{grid-column:1/-1;background:transparent;margin-bottom:6px}
  tr.editing td.qty::before{content:""}
}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.btn{transition:background .15s,color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <h1>Shelf Date Keeper<small>Supermarket stock &amp; expiry list</small></h1>
    <div class="stats" id="stats"></div>
  </div>
</header>

<section class="scan" aria-label="Add an item">
  <div class="wrap">
    <form id="addForm" autocomplete="off">
      <div class="fld f-bc">
        <label for="f-barcode">Barcode</label>
        <div class="bc">
          <input id="f-barcode" inputmode="numeric" placeholder="Scan or type barcode" required>
          <button type="button" class="iconbtn" id="camBtn" title="Scan with phone camera" aria-label="Scan with phone camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
          </button>
          <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
        </div>
      </div>
      <div class="fld f-desc"><label for="f-desc">Description</label>
        <div class="bc">
          <input id="f-desc" placeholder="e.g. Digestive biscuits 400g" required>
          <button type="button" class="iconbtn" id="labelBtn" title="Photo of label: fills in name and size" aria-label="Read name and size from a photo of the label" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </button>
          <input type="file" id="labelFile" accept="image/*" capture="environment" hidden>
        </div>
      </div>
      <div class="fld f-sec"><label for="f-sec">Section</label><select id="f-sec"></select></div>
      <div class="fld f-exp"><label for="f-exp">Expiry date</label><input id="f-exp" type="date" required></div>
      <div class="fld f-qty"><label for="f-qty">Qty</label><input id="f-qty" type="number" min="0" value="1" class="num"></div>
      <div class="fld f-go"><label>&nbsp;</label><button class="btn" type="submit">Add item</button></div>
    </form>
    <div class="hint" id="hint">Tip: plug in or pair a barcode scanner, tap the Barcode box, and scan. It fills in by itself.</div>
  </div>
</section>

<main class="wrap">
  <section class="due" id="due" aria-label="Coming up"></section>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div class="bar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search description or barcode" aria-label="Search">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by date"></div>
    <select id="warnDays" aria-label="Expiring soon means within">
      <option value="7">Soon = 7 days</option>
      <option value="14">Soon = 14 days</option>
      <option value="30">Soon = 30 days</option>
    </select>
  </div>

  <div class="sechead">
    <h2 id="secTitle">All sections</h2>
    <div class="meta"><span id="secMeta"></span> <span id="secTools"></span></div>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr>
        <th><button data-sort="description">Description</button></th>
        <th>Barcode</th>
        <th id="thSec">Section</th>
        <th><button data-sort="expiry">Expiry ▾</button></th>
        <th>Qty</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>
    <span id="saveMode">Loading your stock list…</span>
    <span><button class="btn ghost small" id="exportBtn" hidden>Download CSV</button></span>
  </footer>
</main>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const DEFAULT_SECTIONS=[
  {id:"non-food",name:"Non-food",order:1},
  {id:"liquor",name:"Liquor",order:2},
  {id:"biscuits",name:"Biscuits",order:3},
  {id:"frozen",name:"Frozen",order:4}
];
const state={items:[],sections:[],active:"all",q:"",status:"all",warn:7,sort:"expiry",editing:null,confirmDel:null,mode:"loading",confirmSec:false};
let db=null, downloads=null, sampler=null;
const REMIND_CHOICES=[[30,"1 month"],[7,"1 week"],[3,"3 days"],[1,"1 day"],[0,"On the day"]];
state.remind={days:[30,7,3,1,0]};
state.remindEdit=false;

/* ---------- storage ---------- */
const LS="sdk-local-v1";
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||"null");return v}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({items:state.items,sections:state.sections}))}catch(e){}idbMirror()}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("sdk",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const d=await idbOpen();await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(_){}}
async function idbGet(k){try{const d=await idbOpen();return await new Promise(res=>{const r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)})}catch(_){return undefined}}
function idbMirror(){idbSet("list",{items:state.items.map(i=>({description:i.description,expiry:i.expiry,qty:i.qty,section:secName(i.section)})),remind:state.remind})}
try{const w=localStorage.getItem("sdk-warn");if(w)state.warn=+w}catch(e){}
$("#warnDays").value=String(state.warn);

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function slug(s){return (s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"section")+"-"+Math.random().toString(36).slice(2,5)}

async function saveItem(it){
  if(state.mode==="db"){await db.collection("items").doc(it.id).set(it)}
  else{const i=state.items.findIndex(x=>x.id===it.id);if(i>=0)state.items[i]=it;else state.items.push(it);lsSave();render()}
}
async function removeItem(id){
  if(state.mode==="db"){await db.collection("items").doc(id).delete()}
  else{state.items=state.items.filter(x=>x.id!==id);lsSave();render()}
}
async function saveSection(s){
  if(state.mode==="db"){await db.collection("sections").doc(s.id).set(s)}
  else{state.sections.push(s);lsSave();render()}
}
async function removeSection(id){
  if(state.mode==="db"){await db.collection("sections").doc(id).delete()}
  else{state.sections=state.sections.filter(x=>x.id!==id);lsSave();render()}
}

/* ---------- dates ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysLeft(exp){if(!exp)return null;const [y,m,d]=exp.split("-").map(Number);const t=new Date();const a=Date.UTC(y,m-1,d),b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-b)/864e5)}
function statusOf(it){const n=daysLeft(it.expiry);if(n===null)return"good";if(n<0)return"bad";if(n<=state.warn)return"warn";return"good"}
function statusText(n){if(n===null)return"No date";if(n<0)return"Expired "+(-n)+"d ago";if(n===0)return"Expires today";if(n===1)return"1 day left";return n+" days left"}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){if(!s)return"—";const [y,m,d]=s.split("-");return +d+" "+MON[+m-1]+" "+y}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function secName(id){const s=state.sections.find(x=>x.id===id);return s?s.name:"Unsorted"}

/* ---------- render ---------- */
function sortedSections(){return [...state.sections].sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name))}
function render(){
  const secs=sortedSections();
  if(state.active!=="all"&&!secs.find(s=>s.id===state.active))state.active="all";
  // section select in add form
  const sel=$("#f-sec"),cur=sel.value;
  sel.innerHTML=secs.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")||`<option value="">Add a section first</option>`;
  if(state.active!=="all")sel.value=state.active;else if(cur&&secs.find(s=>s.id===cur))sel.value=cur;

  // stats
  const all=state.items;
  const nBad=all.filter(i=>statusOf(i)==="bad").length,nWarn=all.filter(i=>statusOf(i)==="warn").length;
  $("#stats").innerHTML=`
    <button class="stat" data-st="all"><b class="num">${all.length}</b><span>Items</span></button>
    <button class="stat ${nWarn?"alert":""}" data-st="warn"><b class="num">${nWarn}</b><span>Expiring soon</span></button>
    <button class="stat ${nBad?"alert":""}" data-st="bad"><b class="num">${nBad}</b><span>Expired</span></button>`;

  // tabs
  const cnt=id=>all.filter(i=>i.section===id).length;
  let t=`<button class="tab" role="tab" aria-selected="${state.active==="all"}" data-tab="all">All<span class="c num">${all.length}</span></button>`;
  t+=secs.map(s=>`<button class="tab" role="tab" aria-selected="${state.active===s.id}" data-tab="${esc(s.id)}">${esc(s.name)}<span class="c num">${cnt(s.id)}</span></button>`).join("");
  t+=state.addingSec
    ?`<form class="newsec" id="secForm"><input id="secName" placeholder="Section name" maxlength="40" required><button class="btn small">Add</button><button type="button" class="btn ghost small" id="secCancel">Cancel</button></form>`
    :`<button class="tab add" id="addSec">+ New section</button>`;
  $("#tabs").innerHTML=t;
  if(state.addingSec)setTimeout(()=>$("#secName")&&$("#secName").focus(),0);

  // chips
  const chips=[["all","All dates"],["bad","Expired"],["warn","Expiring soon"],["good","OK"]];
  $("#chips").innerHTML=chips.map(([k,l])=>`<button class="chip" aria-pressed="${state.status===k}" data-chip="${k}">${l}</button>`).join("");

  // list
  const q=state.q.trim().toLowerCase();
  let list=all.filter(i=>(state.active==="all"||i.section===state.active)
    &&(state.status==="all"||statusOf(i)===state.status)
    &&(!q||(i.description||"").toLowerCase().includes(q)||(i.barcode||"").includes(q)));
  list.sort(state.sort==="description"
    ?(a,b)=>(a.description||"").localeCompare(b.description||"")
    :(a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999"));

  const isAll=state.active==="all";
  $("#secTitle").textContent=isAll?"All sections":secName(state.active);
  $("#thSec").hidden=!isAll;
  $("#secMeta").textContent=`${list.length} shown`;
  $("#secTools").innerHTML=(!isAll)
    ?(state.confirmSec
      ?` · Delete this section? <button class="linkbtn" id="secDelYes">Yes, delete</button> <button class="linkbtn" id="secDelNo">Keep</button>`
      :` · <button class="linkbtn" id="secDel">Delete section</button>`)
    :"";

  const tb=$("#rows");
  if(state.mode==="loading"){tb.innerHTML=`<tr><td colspan="7" class="empty"><b>Loading your stock list…</b>Your sections and items will appear here.</td></tr>`;return}
  if(!list.length){
    const msg=all.length?"No items match this search or filter.":"No items yet.";
    tb.innerHTML=`<tr><td colspan="7" class="empty"><b>${msg}</b>Scan a barcode above, add a description and expiry date, then press Add item.</td></tr>`;
  }else{
    tb.innerHTML=list.map(i=>state.editing===i.id?editRow(i,secs,isAll):viewRow(i,isAll)).join("");
  }
  $("#exportBtn").hidden=!all.length;
  renderDue();
}

const bcIn=$("#f-barcode");
function lookupBarcode(){
  const code=bcIn.value.trim();if(!code)return;
  const known=state.items.filter(i=>i.barcode===code);
  if(known.length){
    const k=known[known.length-1];
    if(!$("#f-desc").value)$("#f-desc").value=k.description;
    if(k.section&&state.sections.find(s=>s.id===k.section))$("#f-sec").value=k.section;
    hint(`Known item: ${k.description}. ${known.length} batch${known.length>1?"es":""} already listed. Enter the new expiry date.`,"");
    $("#f-exp").focus();
  }else{$("#f-desc").focus();if(!$("#f-desc").value)onlineLookup(code)}
}
async function fetchProduct(host,code){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch(`https://${host}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,quantity`,{signal:ctl.signal});
    if(!r.ok)return null;const j=await r.json();if(!j||j.status!==1||!j.product)return null;
    const p=j.product,name=String(p.product_name_en||p.product_name||"").trim(),brand=String(p.brands||"").split(",")[0].trim(),qty=String(p.quantity||"").replace(/\s+/g,"").trim();
    if(!name&&!brand)return null;
    const full=(brand&&!name.toLowerCase().includes(brand.toLowerCase())?brand+" ":"")+name;
    return [full.trim(),qty].filter(Boolean).join(" ");
  }catch(_){return null}finally{clearTimeout(t)}
}
async function onlineLookup(code){
  if(!/^\d{8,14}$/.test(code))return;
  if(!navigator.onLine){hint("Offline, so the name can't be looked up. Type the description.","");return}
  hint("Looking up the product name…");
  let found=await fetchProduct("world.openfoodfacts.org",code);
  if(!found)found=await fetchProduct("world.openproductsfacts.org",code);
  if(bcIn.value.trim()!==code)return;
  if(found&&!$("#f-desc").value){$("#f-desc").value=found;hint("Name filled in from the product database. Check it, then add the expiry date.","ok");$("#f-exp").focus()}
  else if(!found)hint("Product not found online. Type the description once and the app will remember it.","");
}

async function decodeImage(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  if("BarcodeDetector" in window){
    try{const det=new BarcodeDetector();const r=await det.detect(img);if(r&&r[0]){URL.revokeObjectURL(url);return r[0].rawValue}}catch(_){}
  }
  if(!window.ZXing){URL.revokeObjectURL(url);return null}
  for(const max of [1400,900,2000]){
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    try{
      const src=new ZXing.HTMLCanvasElementLuminanceSource(c);
      const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
      const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
      const r=new ZXing.MultiFormatReader();r.setHints(hints);
      const out=r.decode(bmp).getText();URL.revokeObjectURL(url);return out;
    }catch(_){}
  }
  URL.revokeObjectURL(url);return null;
}

/* ---------- coming up + reminder choices ---------- */
function names(list,max=6){const n=list.map(i=>esc(i.description));return n.length<=max?n.join(", "):n.slice(0,max).join(", ")+` <span class="due-note">+${n.length-max} more</span>`}
function renderDue(){
  const box=$("#due");
  if(state.mode==="loading"){box.innerHTML=`<div class="due-head"><h3>Coming up</h3></div><div class="due-note">Checking expiry dates…</div>`;return}
  const by=f=>state.items.filter(i=>{const n=daysLeft(i.expiry);return n!==null&&f(n)}).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  const groups=[
    ["bad","Expired",by(n=>n<0)],
    ["bad","Today",by(n=>n===0)],
    ["warn","Next 3 days",by(n=>n>=1&&n<=3)],
    ["warn","Next 7 days",by(n=>n>=4&&n<=7)],
    ["good","Next 30 days",by(n=>n>=8&&n<=30)]
  ].filter(g=>g[2].length);
  const rows=groups.length
    ?groups.map(([k,l,list])=>`<div class="due-row"><span class="pill ${k}">${l} · ${list.length}</span><div class="due-names">${names(list)}</div></div>`).join("")
    :`<div class="due-note">Nothing expires in the next 30 days.</div>`;
  const days=state.remind.days||[];
  const daysText=REMIND_CHOICES.filter(([d])=>days.includes(d)).map(([,l])=>l==="On the day"?"on the day":l+" before").join(", ");
  const alertLine=state.mode==="db"
    ?(state.remindEdit
      ?`<div class="due-days"><span class="due-note">Phone alert for items</span>${REMIND_CHOICES.map(([d,l])=>`<button class="chip" aria-pressed="${days.includes(d)}" data-rday="${d}">${l}${d?" before":""}</button>`).join("")}<button class="linkbtn" id="remindDone">Done</button></div>`
      :`<div class="due-note">${days.length?`Phone alert each morning (about 7:40) for items ${esc(daysText)}.`:"Phone alerts are off."} <button class="linkbtn" id="remindEdit">Change</button></div>`)
    :localAlertLine(days,daysText);
  box.innerHTML=`<div class="due-head"><h3>Coming up</h3></div>${rows}${alertLine}`;
}
let remindSaving=Promise.resolve();
async function toggleRemindDay(d){
  const days=new Set(state.remind.days||[]);days.has(d)?days.delete(d):days.add(d);
  state.remind={days:[...days].sort((a,b)=>b-a)};renderDue();
  if(state.mode!=="db"){try{localStorage.setItem("sdk-remind",JSON.stringify(state.remind))}catch(_){}idbMirror();return}
  if(state.mode==="db"){remindSaving=remindSaving.then(()=>db.doc("settings/reminders").set(state.remind)).catch(()=>hint("Could not save the reminder choice. Try again.","err"))}
}

/* ---------- local phone alerts + calendar ---------- */
function localAlertLine(days,daysText){
  const chooser=`<div class="due-days"><span class="due-note">Alert for items</span>${REMIND_CHOICES.map(([d,l])=>`<button class="chip" aria-pressed="${days.includes(d)}" data-rday="${d}">${l}${d?" before":""}</button>`).join("")}<button class="linkbtn" id="remindDone">Done</button></div>`;
  if(state.remindEdit)return chooser;
  if(!("Notification" in window)||!("serviceWorker" in navigator))return `<div class="due-note">This browser can't show phone alerts. Tap Remind on an item to put it in your calendar.</div>`;
  if(Notification.permission==="denied")return `<div class="due-note">Phone alerts are blocked. Turn on notifications for this app in your phone's Settings, then reopen it.</div>`;
  if(Notification.permission!=="granted")return `<div class="due-note"><button class="btn small" id="alertsOn">Turn on phone alerts</button> Get a daily alert for items ${esc(daysText||"close to expiry")}.</div>`;
  return `<div class="due-note">${days.length?`Phone alert once a day for items ${esc(daysText)}.`:"Phone alerts are off."} <button class="linkbtn" id="remindEdit">Change</button></div>`;
}
function alertItems(){
  const days=state.remind.days||[];
  return state.items.filter(i=>{const n=daysLeft(i.expiry);return n!==null&&(n<0||days.includes(n))}).sort((a,b)=>a.expiry.localeCompare(b.expiry));
}
async function turnOnAlerts(){
  try{
    const p=await Notification.requestPermission();
    if(p!=="granted"){hint("Alerts not allowed. You can still tap Remind on an item to use your calendar.","err");renderDue();return}
    const reg=await navigator.serviceWorker.ready;
    if(reg.periodicSync){try{await reg.periodicSync.register("expiry-check",{minInterval:12*60*60*1000})}catch(_){}}
    idbMirror();hint("Phone alerts are on.","ok");renderDue();checkAlertsNow(true);
  }catch(_){hint("Couldn't turn on alerts on this phone.","err")}
}
async function checkAlertsNow(force){
  if(state.mode==="db"||!("Notification" in window)||Notification.permission!=="granted")return;
  const today=todayStr();if(!force&&(await idbGet("lastAlert"))===today)return;
  const list=alertItems();if(!list.length)return;
  const reg=await navigator.serviceWorker.ready.catch(()=>null);if(!reg)return;
  const lines=list.slice(0,6).map(i=>`${i.description}: ${statusText(daysLeft(i.expiry)).toLowerCase()}`);
  if(list.length>6)lines.push(`+${list.length-6} more`);
  await reg.showNotification(`${list.length} item${list.length>1?"s":""} to check`,{body:lines.join("\n"),icon:"icon-192.png",badge:"icon-192.png",tag:"expiry"});
  idbSet("lastAlert",today);
}
function calReminder(id){
  const i=state.items.find(x=>x.id===id);if(!i||!i.expiry)return;
  const [y,m,d]=i.expiry.split("-").map(Number);
  const when=new Date(y,m-1,d-state.warn),now=new Date();now.setHours(0,0,0,0);
  const day=when<now?now:when;
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0");
  const next=new Date(day);next.setDate(next.getDate()+1);
  const title=`Check expiry: ${i.description}`;
  const details=`${i.description}\nExpires: ${fmtDate(i.expiry)}\nSection: ${secName(i.section)}\nQty: ${i.qty??""}\nBarcode: ${i.barcode}`;
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${f(day)}/${f(next)}&details=${encodeURIComponent(details)}`;
  window.open(url,"_blank");
}

  const btn=$("#labelBtn");btn.disabled=true;
  hint("Reading the label…");
  try{
    const r=await sampler.json(
      'This is a photo of a product from a supermarket shelf. Read the packaging. Reply with only a JSON object: {"name": string, "size": string}. '+
      '"name" is the brand plus product name as printed, in normal capitalisation, e.g. "Peak Evaporated Milk" or "Johnnie Walker Red Label Whisky". '+
      '"size" is the net weight, volume or pack size as printed, written compactly, e.g. "410g", "1.5L", "750ml", "12 x 330ml". '+
      'Use "" for anything you cannot read. Do not guess a size that is not visible.',
      {images:f,modelTier:"quick",cache:false}
    );
    const name=String(r&&r.name||"").trim(), size=String(r&&r.size||"").trim();
    if(!name&&!size){hint("Couldn't read the label. Try again closer, with the front of the pack filling the photo.","err");return}
    $("#f-desc").value=[name,size].filter(Boolean).join(" ");

    $("#f-exp").focus();

    if(c==="not_granted"||c==="sampling_disabled"||c==="images_unavailable"||c==="not_declared"){btn.hidden=true;hint("Label reading isn't allowed here. Type the description instead.","err")}
    else if(c==="rate_limited")hint("Too many label photos at once. Wait a minute and try again.","err");
    else if(c==="image_rejected")hint("That photo couldn't be used. Take a new one.","err");
    else if(c!=="cancelled")hint("Couldn't read the label. Try again.","err");
  }finally{btn.disabled=false}
});

/* ---------- export ---------- */
async function exportCsv(){
  const rows=[["Section","Description","Barcode","Expiry","Days left","Qty"]];
  [...state.items].sort((a,b)=>secName(a.section).localeCompare(secName(b.section))||(a.expiry||"").localeCompare(b.expiry||""))
    .forEach(i=>rows.push([secName(i.section),i.description,i.barcode,i.expiry,daysLeft(i.expiry),i.qty]));
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const fn=`stock-expiry-${todayStr()}.csv`;if(downloads){try{await downloads.save({filename:fn,data:csv});}catch(_){hint("Download was cancelled.","")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

      {id:uid(),barcode:"6001108012345",description:"Lager beer 330ml can",section:"liquor",expiry:add(-3),qty:48,example:true}
    ];
    lsSave();
  }
  try{const r=JSON.parse(localStorage.getItem("sdk-remind")||"null");if(r&&Array.isArray(r.days))state.remind={days:r.days.map(Number)}}catch(_){}
  idbMirror();setTimeout(()=>checkAlertsNow(false),1500);
  $("#saveMode").textContent="Saved on this phone only. Tap Download CSV now and then to keep a backup.";
  render();
}
function startDb(){
  state.mode="db";
  $("#saveMode").textContent="Connecting…";
  let gotItems=false,gotSecs=false;
  const timer=setTimeout(()=>{if(!gotItems||!gotSecs)$("#saveMode").textContent="Can't reach your saved list yet. Check your connection."},10000);
  const done=()=>{if(gotItems&&gotSecs){clearTimeout(timer);$("#saveMode").textContent="Saved online. Open this page on any phone to see the same list."}};
  db.collection("sections").onSnapshot(s=>{
    state.sections=s.docs.map(d=>d.data());if(!s.metadata.fromCache){gotSecs=true;done()}
    render();
  },()=>{clearTimeout(timer);$("#saveMode").textContent="Lost connection to your saved list. Reload the page."});
  db.collection("items").onSnapshot(s=>{
    state.items=s.docs.map(d=>d.data());if(!s.metadata.fromCache){gotItems=true;done()}
    render();
  },()=>{clearTimeout(timer)});
  db.doc("settings/reminders").onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.days))state.remind={days:d.days.map(Number)}}
    renderDue();
  },()=>{});
}
render();
(async()=>{
  try{
    if(window.claude&&claude.use){
      const [d,dl,sm]=await Promise.all([claude.use("db"),claude.use("downloads"),claude.use("sample")]);
      db=d;downloads=dl;sampler=sm;
    }
  }catch(_){db=null}
  if(db)startDb();else startLocal();
  setupLabelReader();
})();
setTimeout(()=>{if(state.mode==="loading"&&!db)startLocal()},11000);
})();
</script>
