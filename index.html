<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#063d33"><link rel="icon" href="expiry-icon-192.png"><link rel="apple-touch-icon" href="expiry-icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shelf Date Keeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: stockroom ledger — a sticky scan bar on top, section tabs, then the dated item list (table on wide screens, shelf tags on phones). */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#0f1b2d; --muted:#64748b; --line:#e3e8ef;
  --accent:#0b7a5c; --accent-2:#10b981; --accent-ink:#ffffff; --tag:#fcd34d; --tag-ink:#3b2a00;
  --bad:#e11d48; --bad-bg:#fff1f3; --warn:#d97706; --warn-bg:#fff8eb; --good:#059669; --good-bg:#ecfdf5;
  --head1:#063d33; --head2:#0b7a5c; --field:#f1f4f8; --shadow:0 1px 2px rgba(15,27,45,.04),0 6px 20px -8px rgba(15,27,45,.12);
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --ink:#e6edf7; --muted:#94a3b8; --line:#243047;
  --accent:#34d399; --accent-2:#10b981; --accent-ink:#04261c; --tag:#fcd34d; --tag-ink:#2b1f00;
  --bad:#fb7185; --bad-bg:#2a1520; --warn:#fbbf24; --warn-bg:#2a2112; --good:#34d399; --good-bg:#0f2a22;
  --head1:#062a24; --head2:#0b5f48; --field:#0f1828; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --ink:#e6edf7; --muted:#94a3b8; --line:#243047;
  --accent:#34d399; --accent-2:#10b981; --accent-ink:#04261c; --tag:#fcd34d; --tag-ink:#2b1f00;
  --bad:#fb7185; --bad-bg:#2a1520; --warn:#fbbf24; --warn-bg:#2a2112; --good:#34d399; --good-bg:#0f2a22;
  --head1:#062a24; --head2:#0b5f48; --field:#0f1828; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{background:var(--accent);color:var(--accent-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);border-radius:8px;padding:6px 10px;min-width:84px;text-align:left;border:0;cursor:pointer;color:inherit}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1}
.stat span{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;opacity:.9}
.stat.alert b{color:var(--tag)}

/* scan / add panel */
.scan{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.scan .wrap{padding-block:12px}
.scan form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 70px auto;gap:8px;align-items:end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{width:100%;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 10px}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.bc{display:flex;gap:6px}
.bc input{min-width:0;flex:1}
#f-barcode{font-family:var(--f-mono);letter-spacing:.04em}
.iconbtn[hidden]{display:none}
.iconbtn{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.btn{height:42px;border:0;border-radius:6px;padding:0 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{height:32px;padding:0 10px;font-size:.85rem}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px;min-height:1.2em}
.hint.ok{color:var(--good)} .hint.err{color:var(--bad)}

/* word picker after a label photo */
.pick{margin-top:10px;border:1px solid var(--accent);border-radius:8px;padding:10px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.pick-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:8px;font-size:.88rem;font-weight:600}
.pick-head span{display:flex;gap:14px}
.pick-words{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow-y:auto}
.pick-words .chip{padding:7px 11px;font-size:.95rem}
.pick-words .chip.size{border-style:dashed}
.pick-words .chip.big{font-weight:600}
.aikey{flex-basis:100%;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.aikey form{display:flex;gap:6px;flex-wrap:wrap}
.aikey input{flex:1 1 220px;min-width:0;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-family:var(--f-mono);font-size:.85rem}
.aikey a{color:var(--accent)}
.pick-note{font-size:.8rem;color:var(--muted);margin-top:8px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding-block:14px 4px}
.secpick{flex:1 1 260px;display:flex;flex-direction:column;gap:3px;min-width:0}
.secpick label{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.secpick select{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:1.02rem;font-weight:600;width:100%}
.secpick select.muted{color:var(--muted)}
.secbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.secbtns .tab{height:40px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:center}
.tab .c{font-size:.75rem;background:var(--bg);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .c{background:color-mix(in srgb,var(--bg) 20%,transparent);color:inherit}
.tab.add{border-style:dashed;color:var(--accent)}
.tab-sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:0 6px}
.tab.rem{color:var(--muted);background:transparent}
.tab.rem[aria-pressed="true"]{background:var(--muted);color:var(--bg);border-color:var(--muted)}
.pill.rem{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.rowact button.rmv{background:var(--bad);color:#fff;border-color:var(--bad)}
tr.s-rem{opacity:.85}
.newsec{display:flex;gap:6px;align-items:center;flex:none}
.newsec input{height:34px;border:1px solid var(--accent);border-radius:999px;padding:0 12px;background:var(--surface);width:160px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.search{flex:1 1 240px;min-width:0;position:relative;display:flex;gap:6px}
.search input[type=search]{flex:1;min-width:0}
.search .iconbtn{height:40px;width:40px;background:var(--surface)}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 12px 0 36px}
.search>svg{position:absolute;left:10px;top:10px;width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-weight:600}
.bar select{height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}

.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:.01em}
.sechead .meta{color:var(--muted);font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0}

/* table */
.tablebox{overflow-x:auto;margin-block:10px 30px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.code{font-family:var(--f-mono);font-size:.86rem;color:var(--muted)}
td.desc{font-weight:500}
td.desc .ex{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.sec-lbl{font-size:.8rem;color:var(--muted)}
.pill{display:inline-block;border-radius:4px;padding:3px 8px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.good{background:var(--good-bg);color:var(--good)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.rowact button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:.82rem}
.rowact button.del{color:var(--bad)}
.rowact button.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
tr.editing td{background:color-mix(in srgb,var(--tag) 16%,var(--surface))}
td input,td select{width:100%;height:34px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 8px;min-width:0}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
footer{color:var(--muted);font-size:.8rem;padding-block:0 30px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

/* coming-up panel */
.due{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.due-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.due h3{margin:0;font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.due-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem}
.due-row .pill{justify-self:start}
.due-names{min-width:0;overflow-wrap:anywhere}
.due-note{font-size:.82rem;color:var(--muted)}
.due-days{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.due-days .chip{padding:4px 9px;font-size:.8rem}
@media (max-width:520px){.due-row{grid-template-columns:1fr;gap:3px}}

/* phones: shelf-tag cards */
@media (max-width:760px){
  .scan form{grid-template-columns:1fr 1fr}
  .scan .f-bc,.scan .f-desc{grid-column:1/-1}
  .scan .f-qty{grid-column:1}
  .scan .f-go{grid-column:2}
  .scan .f-go .btn{width:100%}
  .scan{position:static}
  .tablebox{background:transparent;border:0;overflow:visible}
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tag);border-radius:8px;margin-bottom:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  tr.s-rem{border-left-color:var(--muted)}
  tr.s-bad{border-left-color:var(--bad)} tr.s-warn{border-left-color:var(--warn)} tr.s-good{border-left-color:var(--good)}
  td{border:0;padding:0}
  td.desc{grid-column:1;font-size:1.02rem}
  td.st{grid-column:2;grid-row:1;text-align:right}
  td.code{grid-column:1/-1}
  td.exp{grid-column:1;font-size:.88rem}
  td.qty{grid-column:2;text-align:right;font-size:.88rem}
  td.qty::before{content:"Qty ";color:var(--muted)}
  td.secc{grid-column:1/-1}
  td.act{grid-column:1/-1;margin-top:6px}
  td.act .rowact{justify-content:flex-start}
  tr.editing{grid-template-columns:1fr}
  tr.editing td{grid-column:1/-1;background:transparent;margin-bottom:6px}
  tr.editing td.qty::before{content:""}
}
/* ---- friendly dashboard layout ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cardtitle{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 10px;letter-spacing:.01em}
header.top h1{font-size:1.6rem}
.addjump{background:var(--tag);color:var(--tag-ink);height:44px;font-size:1rem;padding:0 18px;border-radius:999px}
.dash{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--muted);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:2.3rem;line-height:1;font-weight:700}
.stat span{font-weight:600;font-size:.95rem}
.stat i{font-style:normal;font-size:.78rem;color:var(--muted)}
.stat.t-bad{border-top-color:var(--bad)} .stat.t-bad.on{background:var(--bad-bg)} .stat.t-bad.on b{color:var(--bad)}
.stat.t-warn{border-top-color:var(--warn)} .stat.t-warn.on{background:var(--warn-bg)} .stat.t-warn.on b{color:var(--warn)}
.stat.t-good{border-top-color:var(--good)} .stat.t-good b{color:var(--good)}
.stat.t-rem{border-top-color:var(--line)} .stat.t-rem b{color:var(--muted)}
.stat:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.due{margin:0;display:flex;flex-direction:column;gap:10px}
.due-head h3{font-size:1.35rem}
.due-list{display:flex;flex-direction:column;gap:8px}
.due-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:10px;border-left:6px solid var(--line);background:var(--bg)}
.due-row.g-bad{border-left-color:var(--bad);background:var(--bad-bg)}
.due-row.g-warn{border-left-color:var(--warn);background:var(--warn-bg)}
.due-row.g-good{border-left-color:var(--good);background:var(--good-bg)}
.due-lbl{font-weight:700;display:flex;align-items:center;gap:8px}
.due-lbl b{font-family:var(--f-display);font-size:1.3rem;line-height:1}
.g-bad .due-lbl{color:var(--bad)} .g-warn .due-lbl{color:var(--warn)} .g-good .due-lbl{color:var(--good)}
.due-names{display:flex;flex-direction:column;gap:2px;min-width:0}
.due-item{overflow-wrap:anywhere}
.due-item em{font-style:normal;color:var(--muted);font-size:.85rem}
.due-more{font-size:.85rem;color:var(--muted);font-weight:600}
.due-empty{padding:12px;border-radius:10px;background:var(--good-bg);color:var(--good);font-weight:600}
.due-alerts{border-top:1px solid var(--line);padding-top:10px}
.scan.wrap{background:transparent;border:0;position:static;padding-top:12px}
.addcard{border-top:5px solid var(--accent)}
.listtitle{margin:22px 0 0}
footer.card{margin-bottom:30px;padding-block:14px}
footer.card .cardtitle{flex-basis:100%;margin-bottom:2px}
.rowact button{padding:7px 12px;font-size:.88rem;border-radius:7px}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .due-row{grid-template-columns:1fr;gap:4px}
  header.top h1 small{display:none}
}

/* ---- modern colour pass ---- */
body{font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body::before{background:var(--head1)}
header.top{color:#fff;background:linear-gradient(120deg,var(--head1),var(--head2));box-shadow:0 8px 24px -14px rgba(6,61,51,.8)}
header.top .wrap{padding-block:16px}
h1,h2,.cardtitle,.due h3{font-weight:800;letter-spacing:-.02em}
header.top h1{font-size:1.45rem}
h1 small{letter-spacing:.04em;font-weight:500;opacity:.75;text-transform:none;font-size:.82rem}
.addjump{background:var(--tag);color:var(--tag-ink);font-weight:700;box-shadow:0 6px 16px -6px rgba(252,211,77,.7);border-radius:12px}
.card,.stat,footer.card{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.stat{border-top:0;padding:14px 16px;position:relative;overflow:hidden;gap:3px}
.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--muted)}
.stat b{font-weight:800;font-size:2.1rem;letter-spacing:-.03em}
.stat span{text-transform:none;letter-spacing:0;font-size:.95rem;font-weight:700;opacity:1}
.stat.t-bad::before{background:var(--bad)} .stat.t-warn::before{background:var(--warn)} .stat.t-good::before{background:var(--good)} .stat.t-rem::before{background:var(--line)}
.stat.t-bad.on{background:linear-gradient(135deg,var(--bad-bg),var(--surface))}
.stat.t-warn.on{background:linear-gradient(135deg,var(--warn-bg),var(--surface))}
.stat.t-good{background:linear-gradient(135deg,var(--good-bg),var(--surface))}
.stat:active,.due-row:active{transform:scale(.98)}
.due-row{border-left:0;border-radius:14px;position:relative;padding:12px 14px 12px 18px}
.due-row::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--line)}
.due-row.g-bad::before{background:var(--bad)} .due-row.g-warn::before{background:var(--warn)} .due-row.g-good::before{background:var(--good)}
.due-lbl b{font-weight:800}
.addcard{border-top:0;position:relative;overflow:hidden}
.addcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--tag))}
.fld label,.secpick label,th{letter-spacing:.06em;font-weight:700;font-size:.68rem}
.fld input,.fld select,.secpick select,.search input,.bar select,td input,td select{background:var(--field);border:1px solid transparent;border-radius:12px}
.fld input:focus,.fld select:focus,.search input:focus,.secpick select:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
.secpick select{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.iconbtn{border-radius:12px;background:var(--field);border:1px solid transparent;color:var(--accent)}
.search .iconbtn{background:var(--field)}
.btn{border-radius:12px;font-weight:700}
.btn:not(.ghost):not(.addjump){background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--accent)}
.tab,.chip{border-radius:999px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab.add{background:transparent}
.tab.rem[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{border-radius:999px;padding:4px 10px;font-weight:700;font-size:.78rem}
.tablebox{border-radius:18px;box-shadow:var(--shadow);border-color:var(--line)}
th{background:var(--field)}
.rowact button{border-radius:10px;font-weight:600;background:var(--surface)}
.rowact button.rmv{background:var(--bad);border-color:var(--bad);color:#fff}
.pick{border-radius:14px;border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
@media (max-width:760px){
  tr{border:1px solid var(--line);border-left:5px solid var(--tag);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
  tr.s-bad{border-left-color:var(--bad)} tr.s-warn{border-left-color:var(--warn)} tr.s-good{border-left-color:var(--good)} tr.s-rem{border-left-color:var(--muted)}
  .stats{gap:10px}
}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.btn,.stat,.due-row{transition:background .15s,color .15s,transform .12s}}
</style>

<header class="top">
  <div class="wrap">
    <h1>Shelf Date Keeper<small>Supermarket stock &amp; expiry list</small></h1>
    <button class="btn addjump" id="jumpAdd" type="button">+ Add item</button>
  </div>
</header>

<section class="wrap dash" aria-label="Dashboard">
  <div class="stats" id="stats"></div>
  <section class="due card" id="due" aria-label="Coming up"></section>
</section>

<section class="scan wrap" aria-label="Add an item">
  <div class="card addcard" id="addCard">
    <h2 class="cardtitle">Add stock</h2>
    <form id="addForm" autocomplete="off">
      <div class="fld f-bc">
        <label for="f-barcode">Barcode</label>
        <div class="bc">
          <input id="f-barcode" inputmode="numeric" placeholder="Scan or type barcode" required>
          <button type="button" class="iconbtn" id="camBtn" title="Scan with phone camera" aria-label="Scan with phone camera">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
          </button>
          <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
        </div>
      </div>
      <div class="fld f-desc"><label for="f-desc">Description</label>
        <div class="bc">
          <input id="f-desc" placeholder="e.g. Digestive biscuits 400g" required>
          <button type="button" class="iconbtn" id="labelBtn" title="Photo of label: fills in name and size" aria-label="Read name and size from a photo of the label" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </button>
          <input type="file" id="labelFile" accept="image/*" capture="environment" hidden>
        </div>
      </div>
      <div class="fld f-sec"><label for="f-sec">Section</label><select id="f-sec"></select></div>
      <div class="fld f-exp"><label for="f-exp">Expiry date</label><input id="f-exp" type="date" required></div>
      <div class="fld f-qty"><label for="f-qty">Qty</label><input id="f-qty" type="number" min="0" value="1" class="num"></div>
      <div class="fld f-go"><label>&nbsp;</label><button class="btn" type="submit">Add item</button></div>
    </form>
    <div class="pick" id="pick" hidden></div>
    <div class="hint" id="hint">Tip: tap the barcode button to scan with the camera, or use a barcode scanner on the Barcode box.</div>
  </div>
</section>

<main class="wrap">
  <h2 class="cardtitle listtitle" id="stockList">Stock list</h2>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div class="bar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search description or barcode" aria-label="Search">
      <button type="button" class="iconbtn" id="qCamBtn" title="Scan a barcode to search" aria-label="Scan a barcode to search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
      </button>
      <input type="file" id="qCamFile" accept="image/*" capture="environment" hidden>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by date"></div>
    <select id="warnDays" aria-label="Expiring soon means within">
      <option value="7">Soon = 7 days</option>
      <option value="14">Soon = 14 days</option>
      <option value="30">Soon = 30 days</option>
    </select>
  </div>

  <div class="sechead">
    <h2 id="secTitle">All sections</h2>
    <div class="meta"><span id="secMeta"></span> <span id="secTools"></span></div>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr>
        <th><button data-sort="description">Description</button></th>
        <th>Barcode</th>
        <th id="thSec">Section</th>
        <th><button data-sort="expiry">Expiry ▾</button></th>
        <th>Qty</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer class="card">
    <h2 class="cardtitle">Downloads &amp; settings</h2>
    <span id="saveMode">Loading your stock list…</span>
    <span class="exp-btns"><button class="btn ghost small" id="exportBtn" hidden>Download CSV</button> <button class="btn ghost small" id="exportAllBtn" hidden>Download all</button> <button class="btn ghost small" id="barcodeTxtBtn" hidden>Barcodes (.txt)</button></span>
    <div class="aikey" id="aikey"></div>
  </footer>
</main>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const DEFAULT_SECTIONS=[
  {id:"non-food",name:"Non-food",order:1},
  {id:"liquor",name:"Liquor",order:2},
  {id:"biscuits",name:"Biscuits",order:3},
  {id:"frozen",name:"Frozen",order:4}
];
const state={items:[],sections:[],active:"all",q:"",status:"all",warn:7,sort:"expiry",editing:null,confirmDel:null,mode:"loading",confirmSec:false};
let db=null, downloads=null, sampler=null;
const REMIND_CHOICES=[[30,"1 month"],[7,"1 week"],[3,"3 days"],[1,"1 day"],[0,"On the day"]];
state.remind={days:[30,7,3,1,0]};
state.remindEdit=false;

/* ---------- storage ---------- */
const LS="sdk-local-v1";
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||"null");return v}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({items:state.items,sections:state.sections}))}catch(e){}idbMirror()}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("sdk",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const d=await idbOpen();await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(_){}}
async function idbGet(k){try{const d=await idbOpen();return await new Promise(res=>{const r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)})}catch(_){return undefined}}
function idbMirror(){idbSet("list",{items:state.items.filter(i=>!i.removedAt).map(i=>({description:i.description,expiry:i.expiry,qty:i.qty,section:secName(i.section)})),remind:state.remind})}
try{const w=localStorage.getItem("sdk-warn");if(w)state.warn=+w}catch(e){}
$("#warnDays").value=String(state.warn);

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function slug(s){return (s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"section")+"-"+Math.random().toString(36).slice(2,5)}

async function saveItem(it){
  if(state.mode==="db"){await db.collection("items").doc(it.id).set(it)}
  else{const i=state.items.findIndex(x=>x.id===it.id);if(i>=0)state.items[i]=it;else state.items.push(it);lsSave();render()}
}
async function removeItem(id){
  if(state.mode==="db"){await db.collection("items").doc(id).delete()}
  else{state.items=state.items.filter(x=>x.id!==id);lsSave();render()}
}
async function saveSection(s){
  if(state.mode==="db"){await db.collection("sections").doc(s.id).set(s)}
  else{state.sections.push(s);lsSave();render()}
}
async function removeSection(id){
  if(state.mode==="db"){await db.collection("sections").doc(id).delete()}
  else{state.sections=state.sections.filter(x=>x.id!==id);lsSave();render()}
}

/* ---------- dates ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysLeft(exp){if(!exp)return null;const [y,m,d]=exp.split("-").map(Number);const t=new Date();const a=Date.UTC(y,m-1,d),b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-b)/864e5)}
function statusOf(it){const n=daysLeft(it.expiry);if(n===null)return"good";if(n<0)return"bad";if(n<=state.warn)return"warn";return"good"}
function statusText(n){if(n===null)return"No date";if(n<0)return"Expired "+(-n)+"d ago";if(n===0)return"Expires today";if(n===1)return"1 day left";return n+" days left"}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){if(!s)return"—";const [y,m,d]=s.split("-");return +d+" "+MON[+m-1]+" "+y}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function live(){return state.items.filter(i=>!i.removedAt)}
function removedList(){return state.items.filter(i=>i.removedAt)}
function secName(id){const s=state.sections.find(x=>x.id===id);return s?s.name:"Unsorted"}

/* ---------- render ---------- */
function sortedSections(){return [...state.sections].sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name))}
function render(){
  const secs=sortedSections();
  const inRem=state.active==="removed";
  if(state.active!=="all"&&!inRem&&!secs.find(s=>s.id===state.active))state.active="all";
  // section select in add form
  const sel=$("#f-sec"),cur=sel.value;
  sel.innerHTML=secs.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")||`<option value="">Add a section first</option>`;
  if(state.active!=="all"&&!inRem)sel.value=state.active;else if(cur&&secs.find(s=>s.id===cur))sel.value=cur;

  // stats
  const all=live(),rem=removedList();
  const nBad=all.filter(i=>statusOf(i)==="bad").length,nWarn=all.filter(i=>statusOf(i)==="warn").length;
  const nGood=all.length-nBad-nWarn;
  $("#stats").innerHTML=`
    <button class="stat t-bad ${nBad?"on":""}" data-st="bad"><b class="num">${nBad}</b><span>Expired</span><i>${nBad?"Take off the shelf":"All clear"}</i></button>
    <button class="stat t-warn ${nWarn?"on":""}" data-st="warn"><b class="num">${nWarn}</b><span>Expiring soon</span><i>Within ${state.warn} days</i></button>
    <button class="stat t-good" data-st="good"><b class="num">${nGood}</b><span>OK</span><i>${all.length} items in stock</i></button>
    <button class="stat t-rem" data-tab="removed"><b class="num">${rem.length}</b><span>Removed</span><i>Taken off shelf</i></button>`;

  // tabs
  const cnt=id=>all.filter(i=>i.section===id).length;
  let t=`<div class="secpick"><label for="secSelect">Section</label>
    <select id="secSelect" class="${inRem?"muted":""}">
      ${inRem?`<option value="removed" selected>Removed items (${rem.length})</option>`:""}
      <option value="all" ${state.active==="all"?"selected":""}>All sections (${all.length})</option>
      ${secs.map(s=>`<option value="${esc(s.id)}" ${state.active===s.id?"selected":""}>${esc(s.name)} (${cnt(s.id)})</option>`).join("")}
    </select></div>`;
  t+=`<div class="secbtns">`+(state.addingSec
    ?`<form class="newsec" id="secForm"><input id="secName" placeholder="Section name" maxlength="40" required><button class="btn small">Add</button><button type="button" class="btn ghost small" id="secCancel">Cancel</button></form>`
    :`<button class="tab add" id="addSec">+ New section</button>`);
  t+=`<button class="tab rem" aria-pressed="${inRem}" data-tab="${inRem?"all":"removed"}">${inRem?"Close removed items":"Removed items"}<span class="c num">${rem.length}</span></button></div>`;
  $("#tabs").innerHTML=t;
  if(state.addingSec)setTimeout(()=>$("#secName")&&$("#secName").focus(),0);

  // chips
  const chips=[["all","All dates"],["bad","Expired"],["warn","Expiring soon"],["good","OK"]];
  $("#chips").hidden=inRem;
  $("#chips").innerHTML=chips.map(([k,l])=>`<button class="chip" aria-pressed="${state.status===k}" data-chip="${k}">${l}</button>`).join("");

  // list
  let list=visibleList();
  /*i=>(state.active==="all"||i.section===state.active)
    &&(state.status==="all"||statusOf(i)===state.status)
    &&(!q||(i.description||"").toLowerCase().includes(q)||(i.barcode||"").includes(q)));
  list.sort(state.sort==="description"
    ?(a,b)=>(a.description||"").localeCompare(b.description||"")
    :(a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999"));
  */
  const isAll=state.active==="all"||inRem;
  $("#secTitle").textContent=inRem?"Removed items":isAll?"All sections":secName(state.active);
  $("#thSec").hidden=!isAll;
  $("#secMeta").textContent=`${list.length} shown`;
  $("#secTools").innerHTML=inRem?" · Not counted anywhere else in the app":(!isAll)
    ?(state.confirmSec
      ?` · Delete this section? <button class="linkbtn" id="secDelYes">Yes, delete</button> <button class="linkbtn" id="secDelNo">Keep</button>`
      :` · <button class="linkbtn" id="secDel">Delete section</button>`)
    :"";

  const tb=$("#rows");
  if(state.mode==="loading"){tb.innerHTML=`<tr><td colspan="7" class="empty"><b>Loading your stock list…</b>Your sections and items will appear here.</td></tr>`;return}
  if(!list.length){
    if(inRem)tb.innerHTML=`<tr><td colspan="7" class="empty"><b>${rem.length?"No removed items match this search.":"No removed items."}</b>When an item has expired, tap Removed on it and it moves here.</td></tr>`;
    else{const msg=all.length?"No items match this search or filter.":"No items yet.";
    tb.innerHTML=`<tr><td colspan="7" class="empty"><b>${msg}</b>Scan a barcode above, add a description and expiry date, then press Add item.</td></tr>`;}
  }else{
    tb.innerHTML=list.map(i=>inRem?removedRow(i):state.editing===i.id?editRow(i,secs,isAll):viewRow(i,isAll)).join("");
  }
  const filtered=inRem||list.length!==all.length;
  $("#exportBtn").hidden=!list.length;
  $("#exportBtn").textContent=inRem?(list.length===1?"Download this removed item":`Download these ${list.length} removed items`):filtered?(list.length===1?"Download this item":`Download these ${list.length} items`):"Download CSV";
  $("#exportAllBtn").hidden=!filtered||!all.length;
  $("#barcodeTxtBtn").hidden=!list.length;
  renderDue();
}
function visibleList(){
  const q=state.q.trim().toLowerCase();
  const match=i=>!q||(i.description||"").toLowerCase().includes(q)||(i.barcode||"").includes(q);
  if(state.active==="removed")return removedList().filter(match).sort((a,b)=>(b.removedAt||"").localeCompare(a.removedAt||""));
  const list=live().filter(i=>(state.active==="all"||i.section===state.active)
    &&(state.status==="all"||statusOf(i)===state.status)
    &&(!q||(i.description||"").toLowerCase().includes(q)||(i.barcode||"").includes(q)));
  return list.sort(state.sort==="description"
    ?(a,b)=>(a.description||"").localeCompare(b.description||"")
    :(a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999"));
}
function viewRow(i,isAll){
  const n=daysLeft(i.expiry),st=statusOf(i);
  const del=state.confirmDel===i.id
    ?`<button class="confirm" data-delyes="${esc(i.id)}">Delete</button><button data-delno="1">Keep</button>`
    :`${st==="bad"?`<button class="rmv" data-rmv="${esc(i.id)}" title="Taken off the shelf: move to Removed items">Removed</button>`:`<button data-cal="${esc(i.id)}" title="Add a reminder to Google Calendar">Remind</button>`}<button data-edit="${esc(i.id)}">Edit</button><button class="del" data-del="${esc(i.id)}">Delete</button>`;
  return `<tr class="s-${st}">
    <td class="desc">${esc(i.description)}${i.example?'<span class="ex">Example</span>':""}</td>
    <td class="code">${esc(i.barcode)}</td>
    ${isAll?`<td class="secc"><span class="sec-lbl">${esc(secName(i.section))}</span></td>`:""}
    <td class="exp num">${fmtDate(i.expiry)}</td>
    <td class="qty num">${esc(i.qty??"")}</td>
    <td class="st"><span class="pill ${st}">${statusText(n)}</span></td>
    <td class="act"><div class="rowact">${del}</div></td></tr>`;
}
function removedRow(i){
  const del=state.confirmDel===i.id
    ?`<button class="confirm" data-delyes="${esc(i.id)}">Delete for good</button><button data-delno="1">Keep</button>`
    :`<button data-restore="${esc(i.id)}">Put back</button><button class="del" data-del="${esc(i.id)}">Delete</button>`;
  return `<tr class="s-rem">
    <td class="desc">${esc(i.description)}</td>
    <td class="code">${esc(i.barcode)}</td>
    <td class="secc"><span class="sec-lbl">${esc(secName(i.section))}</span></td>
    <td class="exp num">Expired ${fmtDate(i.expiry)}</td>
    <td class="qty num">${esc(i.qty??"")}</td>
    <td class="st"><span class="pill rem">Removed ${fmtDate(String(i.removedAt).slice(0,10))}</span></td>
    <td class="act"><div class="rowact">${del}</div></td></tr>`;
}
function editRow(i,secs,isAll){
  return `<tr class="editing">
    <td class="desc"><input id="e-desc" value="${esc(i.description)}" aria-label="Description"></td>
    <td class="code"><input id="e-bc" value="${esc(i.barcode)}" aria-label="Barcode" style="font-family:var(--f-mono)"></td>
    ${isAll?`<td class="secc"><select id="e-sec" aria-label="Section">${secs.map(s=>`<option value="${esc(s.id)}" ${s.id===i.section?"selected":""}>${esc(s.name)}</option>`).join("")}</select></td>`:""}
    <td class="exp"><input id="e-exp" type="date" value="${esc(i.expiry)}" aria-label="Expiry date"></td>
    <td class="qty"><input id="e-qty" type="number" min="0" value="${esc(i.qty??"")}" aria-label="Quantity"></td>
    <td class="st"></td>
    <td class="act"><div class="rowact"><button data-save="${esc(i.id)}" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">Save</button><button data-cancel="1">Cancel</button></div></td></tr>`;
}

/* ---------- hint ---------- */
let hintT;
function hint(msg,kind){const h=$("#hint");h.textContent=msg;h.className="hint "+(kind||"");clearTimeout(hintT);if(kind==="ok")hintT=setTimeout(()=>{h.textContent="";h.className="hint"},4000)}

/* ---------- events ---------- */
const bcIn=$("#f-barcode");
function lookupBarcode(){
  const code=bcIn.value.trim();if(!code)return;
  const known=state.items.filter(i=>i.barcode===code);
  if(known.length){
    const k=known[known.length-1];
    if(!$("#f-desc").value)$("#f-desc").value=k.description;
    if(k.section&&state.sections.find(s=>s.id===k.section))$("#f-sec").value=k.section;
    const nl=known.filter(i=>!i.removedAt).length;
    hint(`Known item: ${k.description}. ${nl?`${nl} batch${nl>1?"es":""} on the shelf now. `:""}Enter the new expiry date.`,"");
    $("#f-exp").focus();
  }else{$("#f-desc").focus();if(!$("#f-desc").value)onlineLookup(code)}
}
async function fetchProduct(host,code){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch(`https://${host}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,quantity`,{signal:ctl.signal});
    if(!r.ok)return null;const j=await r.json();if(!j||j.status!==1||!j.product)return null;
    const p=j.product,name=String(p.product_name_en||p.product_name||"").trim(),brand=String(p.brands||"").split(",")[0].trim(),qty=String(p.quantity||"").replace(/\s+/g,"").trim();
    if(!name&&!brand)return null;
    const full=(brand&&!name.toLowerCase().includes(brand.toLowerCase())?brand+" ":"")+name;
    return [full.trim(),qty].filter(Boolean).join(" ");
  }catch(_){return null}finally{clearTimeout(t)}
}
async function onlineLookup(code){
  if(!/^\d{8,14}$/.test(code))return;
  if(!navigator.onLine){hint("Offline, so the name can't be looked up. Type the description.","");return}
  hint("Looking up the product name…");
  let found=await fetchProduct("world.openfoodfacts.org",code);
  if(!found)found=await fetchProduct("world.openproductsfacts.org",code);
  if(bcIn.value.trim()!==code)return;
  if(found&&!$("#f-desc").value){$("#f-desc").value=found;hint("Name filled in from the product database. Check it, then add the expiry date.","ok");$("#f-exp").focus()}
  else if(!found)hint("Product not found online. Type the description once and the app will remember it.","");
}
bcIn.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();lookupBarcode()}});
bcIn.addEventListener("change",lookupBarcode);

async function decodeImage(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  if("BarcodeDetector" in window){
    try{const det=new BarcodeDetector();const r=await det.detect(img);if(r&&r[0]){URL.revokeObjectURL(url);return r[0].rawValue}}catch(_){}
  }
  if(!window.ZXing){URL.revokeObjectURL(url);return null}
  for(const max of [1400,900,2000]){
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    try{
      const src=new ZXing.HTMLCanvasElementLuminanceSource(c);
      const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
      const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
      const r=new ZXing.MultiFormatReader();r.setHints(hints);
      const out=r.decode(bmp).getText();URL.revokeObjectURL(url);return out;
    }catch(_){}
  }
  URL.revokeObjectURL(url);return null;
}

/* ---------- coming up + reminder choices ---------- */
function names(list,max=6){const n=list.map(i=>esc(i.description));return n.length<=max?n.join(", "):n.slice(0,max).join(", ")+` <span class="due-note">+${n.length-max} more</span>`}
function renderDue(){
  const box=$("#due");
  if(state.mode==="loading"){box.innerHTML=`<div class="due-head"><h3>Coming up</h3></div><div class="due-note">Checking expiry dates…</div>`;return}
  const by=f=>live().filter(i=>{const n=daysLeft(i.expiry);return n!==null&&f(n)}).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  const groups=[
    ["bad","Expired",by(n=>n<0)],
    ["bad","Today",by(n=>n===0)],
    ["warn","Next 3 days",by(n=>n>=1&&n<=3)],
    ["warn","Next 7 days",by(n=>n>=4&&n<=7)],
    ["good","Next 30 days",by(n=>n>=8&&n<=30)]
  ].filter(g=>g[2].length);
  const rows=groups.length
    ?groups.map(([k,l,list])=>`<button class="due-row g-${k}" data-goto="${k==="good"?"all":k}"><span class="due-lbl">${l}<b class="num">${list.length}</b></span><span class="due-names">${list.slice(0,5).map(i=>`<span class="due-item">${esc(i.description)} <em>${statusText(daysLeft(i.expiry)).toLowerCase()}</em></span>`).join("")}${list.length>5?`<span class="due-more">+${list.length-5} more</span>`:""}</span></button>`).join("")
    :`<div class="due-empty">Nothing expires in the next 30 days.</div>`;
  const days=state.remind.days||[];
  const daysText=REMIND_CHOICES.filter(([d])=>days.includes(d)).map(([,l])=>l==="On the day"?"on the day":l+" before").join(", ");
  const alertLine=state.mode==="db"
    ?(state.remindEdit
      ?`<div class="due-days"><span class="due-note">Phone alert for items</span>${REMIND_CHOICES.map(([d,l])=>`<button class="chip" aria-pressed="${days.includes(d)}" data-rday="${d}">${l}${d?" before":""}</button>`).join("")}<button class="linkbtn" id="remindDone">Done</button></div>`
      :`<div class="due-note">${days.length?`Phone alert each morning (about 7:40) for items ${esc(daysText)}.`:"Phone alerts are off."} <button class="linkbtn" id="remindEdit">Change</button></div>`)
    :localAlertLine(days,daysText);
  box.innerHTML=`<div class="due-head"><h3>Coming up</h3><span class="due-note">${fmtDate(todayStr())}</span></div><div class="due-list">${rows}</div><div class="due-alerts">${alertLine}</div>`;
}
let remindSaving=Promise.resolve();

  const days=new Set(state.remind.days||[]);days.has(d)?days.delete(d):days.add(d);
  state.remind={days:[...days].sort((a,b)=>b-a)};renderDue();
  if(state.mode!=="db"){try{localStorage.setItem("sdk-remind",JSON.stringify(state.remind))}catch(_){}idbMirror();return}

/* ---------- local phone alerts + calendar ---------- */
function localAlertLine(days,daysText){
  const chooser=`<div class="due-days"><span class="due-note">Alert for items</span>${REMIND_CHOICES.map(([d,l])=>`<button class="chip" aria-pressed="${days.includes(d)}" data-rday="${d}">${l}${d?" before":""}</button>`).join("")}<button class="linkbtn" id="remindDone">Done</button></div>`;
  if(state.remindEdit)return chooser;
  if(!("Notification" in window)||!("serviceWorker" in navigator))return `<div class="due-note">This browser can't show phone alerts. Tap Remind on an item to put it in your calendar.</div>`;
  if(Notification.permission==="denied")return `<div class="due-note">Phone alerts are blocked. Turn on notifications for this app in your phone's Settings, then reopen it.</div>`;
  if(Notification.permission!=="granted")return `<div class="due-note"><button class="btn small" id="alertsOn">Turn on phone alerts</button> Get a daily alert for items ${esc(daysText||"close to expiry")}.</div>`;
  return `<div class="due-note">${days.length?`Phone alert once a day for items ${esc(daysText)}.`:"Phone alerts are off."} <button class="linkbtn" id="remindEdit">Change</button></div>`;
}
function alertItems(){
  const days=state.remind.days||[];
  return live().filter(i=>{const n=daysLeft(i.expiry);return n!==null&&(n<0||days.includes(n))}).sort((a,b)=>a.expiry.localeCompare(b.expiry));
}
async function turnOnAlerts(){
  try{
    const p=await Notification.requestPermission();
    if(p!=="granted"){hint("Alerts not allowed. You can still tap Remind on an item to use your calendar.","err");renderDue();return}
    const reg=await navigator.serviceWorker.ready;
    if(reg.periodicSync){try{await reg.periodicSync.register("expiry-check",{minInterval:12*60*60*1000})}catch(_){}}
    idbMirror();hint("Phone alerts are on.","ok");renderDue();checkAlertsNow(true);
  }catch(_){hint("Couldn't turn on alerts on this phone.","err")}
}
async function checkAlertsNow(force){
  if(state.mode==="db"||!("Notification" in window)||Notification.permission!=="granted")return;
  const today=todayStr();if(!force&&(await idbGet("lastAlert"))===today)return;
  const list=alertItems();if(!list.length)return;
  const reg=await navigator.serviceWorker.ready.catch(()=>null);if(!reg)return;
  const lines=list.slice(0,6).map(i=>`${i.description}: ${statusText(daysLeft(i.expiry)).toLowerCase()}`);
  if(list.length>6)lines.push(`+${list.length-6} more`);
  await reg.showNotification(`${list.length} item${list.length>1?"s":""} to check`,{body:lines.join("\n"),icon:"expiry-icon-192.png",badge:"expiry-icon-192.png",tag:"expiry"});
  idbSet("lastAlert",today);
}
function calReminder(id){
  const i=state.items.find(x=>x.id===id);if(!i||!i.expiry)return;
  const [y,m,d]=i.expiry.split("-").map(Number);
  const when=new Date(y,m-1,d-state.warn),now=new Date();now.setHours(0,0,0,0);
  const day=when<now?now:when;
  const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0");
  const next=new Date(day);next.setDate(next.getDate()+1);
  const title=`Check expiry: ${i.description}`;
  const details=`${i.description}\nExpires: ${fmtDate(i.expiry)}\nSection: ${secName(i.section)}\nQty: ${i.qty??""}\nBarcode: ${i.barcode}`;
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${f(day)}/${f(next)}&details=${encodeURIComponent(details)}`;
  window.open(url,"_blank");
}

    else if(c==="image_rejected")hint("That photo couldn't be used. Take a new one.","err");

/* ---------- read the label on the phone (GitHub version) ---------- */
let tessWorker=null,tessPct=0;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function getTess(){
  if(tessWorker)return tessWorker;
  if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  tessWorker=await Tesseract.createWorker("eng",1,{logger:m=>{if(m.status==="recognizing text"){const pc=Math.round((m.progress||0)*100);if(pc!==tessPct){tessPct=pc;hint(`Reading the label… ${pc}%`)}}}});
  try{await tessWorker.setParameters({tessedit_pageseg_mode:"11",preserve_interword_spaces:"0"})}catch(_){}
  return tessWorker;
}
async function prepPhoto(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const long=Math.max(img.width,img.height),sc=long>2000?2000/long:long<1200?1200/long:1;
  const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.25)";x.drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);return c;
}
const JUNK=/ingredient|nutrition|energy|best before|\bbb\b|\bexp\b|manufactur|made in|produced|distribut|imported|store in|keep |www|\.com|batch|lot |barcode|contains|allergen|per 100|serving|warning|recycl|net w|net wt|net vol|^net\b/i;
function cleanLine(t){return t.replace(/[^A-Za-z0-9&'%.\- ]+/g," ").replace(/\s+/g," ").trim()}
function niceCase(t){return t===t.toUpperCase()?t.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()):t}
function findSize(text){
  const t=text.replace(/,/g,".");
  const multi=t.match(/(\d{1,2})\s?[x×X]\s?(\d+(?:\.\d+)?)\s?(kg|g|ml|cl|l)\b/i);
  if(multi)return `${multi[1]} x ${multi[2]}${multi[3].toLowerCase()==="l"?"L":multi[3].toLowerCase()}`;
  const all=[...t.matchAll(/(\d+(?:\.\d+)?)\s?(kg|g|gr|grams?|mg|ml|cl|ltr|litres?|liters?|l|oz)\b/gi)];
  const pick=all.find(m=>!/mg|oz/i.test(m[2])&&+m[1]>0)||all[0];if(!pick)return"";
  let u=pick[2].toLowerCase();if(/^gr|^gram/.test(u))u="g";if(/^l/.test(u))u="L";
  return pick[1]+u;
}
function pickName(data){
  let lines=(data.lines||[]).filter(l=>l.confidence>45).map(l=>({t:cleanLine(l.text),h:l.bbox.y1-l.bbox.y0,y:l.bbox.y0}));
  if(!lines.length)lines=(data.text||"").split("\n").map((t,i)=>({t:cleanLine(t),h:1,y:i}));
  lines=lines.filter(l=>l.t.length>=3&&(l.t.match(/[A-Za-z]/g)||[]).length>=Math.max(3,l.t.length*0.6)&&!JUNK.test(l.t));
  if(!lines.length)return"";
  const top=[...lines].sort((a,b)=>b.h-a.h).slice(0,2);
  const keep=top.filter(l=>l.h>=top[0].h*0.55).sort((a,b)=>a.y-b.y);
  return keep.map(l=>niceCase(l.t.replace(/\b(\d+(?:[.,]\d+)?)\s?(kg|g|ml|cl|l)\b/ig,"").trim())).filter(Boolean).join(" ").slice(0,60);
}

async function photoB64(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const sc=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.85).split(",")[1];
}
const AI_MODELS=["gemini-3.5-flash-lite","gemini-3.8-flash","gemini-flash-latest"];
async function aiReadLabel(file,key){
  const b64=await photoB64(file);
  const prompt='This is a photo of a product from a supermarket shelf. Read the packaging. Reply with only a JSON object: {"name": string, "size": string}. '+
    '"name" is the brand plus product name as printed, in normal capitalisation, e.g. "Peak Evaporated Milk" or "Johnnie Walker Red Label Whisky". '+
    '"size" is the net weight, volume or pack size as printed, written compactly, e.g. "410g", "1.5L", "750ml", "12 x 330ml". '+
    'Use "" for anything you cannot read. Do not guess a size that is not visible.';
  const body=JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],generationConfig:{responseMimeType:"application/json",temperature:0}});
  for(const m of AI_MODELS){
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
    let r;try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body,signal:ctl.signal})}finally{clearTimeout(t)}
    if(r.status===404)continue;
    if(r.status===400||r.status===401||r.status===403){const e=new Error("key");e.code="bad_key";throw e}
    if(r.status===429){const e=new Error("limit");e.code="limit";throw e}
    if(!r.ok)continue;
    const j=await r.json();
    const txt=(((j.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text||"").join("")||"";
    const o=JSON.parse(txt.replace(/^```(json)?|```$/g,"").trim());
    return {name:String(o.name||"").trim(),size:String(o.size||"").trim()};
  }
  const e=new Error("none");e.code="no_model";throw e;
}
let aiNote="";
async function phoneReadLabel(f){
  const btn=$("#labelBtn");btn.disabled=true;
  const key=getKey();
  if(key&&navigator.onLine){
    closePicker();hint("Reading the label…");
    let note="";
    try{
      const r=await aiReadLabel(f,key);
      if(r.name||r.size){
        $("#f-desc").value=[r.name,r.size].filter(Boolean).join(" ");
        hint(r.size?"Name and size filled in. Check them, then add the expiry date.":"Name filled in. No size was visible, so type it in (for example 400g).","ok");
        $("#f-exp").focus();btn.disabled=false;return;
      }
      note="The AI couldn't read that label, so the phone reader is trying. ";
    }catch(err){
      const c=err&&err.code;
      note=c==="bad_key"?"Your AI key was refused (check it at the bottom of the page). Using the phone reader. ":c==="limit"?"Today's free AI limit is used up. Using the phone reader. ":"The AI reader didn't answer. Using the phone reader. ";
    }
    hint(note);aiNote=note;
  }else aiNote="";
  if(!window.Tesseract&&!navigator.onLine){hint("The label reader needs internet the first time. Type the description for now.","err");btn.disabled=false;return}
  if(!$("#hint").textContent.includes("phone reader"))hint(tessWorker?"Reading the label…":"Getting the label reader ready… (only slow the first time)");
  try{
    const [w,canvas]=await Promise.all([getTess(),prepPhoto(f)]);
    const {data}=await w.recognize(canvas);
    if(!openPicker(data)){hint("Couldn't read any words. Take the photo closer, straight on, with the name filling most of the picture.","err");return}
    hint(aiNote?aiNote.replace(/Using the phone reader\. |so the phone reader is trying\. /,"")+"Tap the words below to build the description.":"",aiNote?"err":"");
  }catch(err){
    tessWorker=null;
    hint(navigator.onLine?"The label reader didn't load. Try again in a moment.":"The label reader needs internet the first time. Type the description for now.","err");
  }finally{btn.disabled=false}
}

/* tap-the-words picker */
const pick={words:[],order:[]};
function wordsFrom(data){
  let w=(data.words||[]).filter(x=>x.confidence>=25).map(x=>({t:cleanLine(x.text).replace(/^[.\-']+|[.\-']+$/g,""),h:x.bbox.y1-x.bbox.y0,x:x.bbox.x0,y:(x.bbox.y0+x.bbox.y1)/2}));
  if(!w.length)w=(data.text||"").split(/\s+/).map((t,i)=>({t:cleanLine(t),h:1,x:i,y:0}));
  w=w.filter(x=>x.t&&/[A-Za-z0-9]/.test(x.t)&&!(x.t.length===1&&!/[A-Za-z0-9]/.test(x.t)));
  if(w.length>40)w=[...w].sort((a,b)=>b.h-a.h).slice(0,40);
  const avg=w.reduce((s,x)=>s+x.h,0)/(w.length||1)||1;
  w.sort((a,b)=>Math.round(a.y/avg)-Math.round(b.y/avg)||a.x-b.x);
  const max=Math.max(1,...w.map(x=>x.h));
  return w.map(x=>({t:niceCase(x.t),big:x.h>=max*0.6}));
}
function openPicker(data){
  const words=wordsFrom(data),size=findSize(data.text||"");
  if(!words.length&&!size)return false;
  pick.words=words.slice();
  if(size&&!words.some(w=>w.t.toLowerCase()===size.toLowerCase()))pick.words.unshift({t:size,size:true});
  // start with a best guess: the name lines plus the size
  const guess=pickName(data).toLowerCase().split(" ").filter(Boolean);
  pick.order=[];let gi=0;
  pick.words.forEach((w,i)=>{if(!w.size&&gi<guess.length&&w.t.toLowerCase()===guess[gi]){pick.order.push(i);gi++}});
  const si=pick.words.findIndex(w=>w.t.toLowerCase()===size.toLowerCase());if(size&&si>=0)pick.order.push(si);
  applyPick();renderPicker();return true;
}
function applyPick(){$("#f-desc").value=pick.order.map(i=>pick.words[i].t).join(" ")}
function renderPicker(){
  const box=$("#pick");
  box.innerHTML=`<div class="pick-head">Tap words to build the description<span><button type="button" class="linkbtn" id="pickClear">Clear</button><button type="button" class="linkbtn" id="pickDone">Done</button></span></div>
  <div class="pick-words">${pick.words.map((w,i)=>`<button type="button" class="chip${w.size?" size":""}${w.big?" big":""}" aria-pressed="${pick.order.includes(i)}" data-pw="${i}">${esc(w.t)}</button>`).join("")}</div>
  <div class="pick-note">Tap in the order you want. Tap again to remove. You can still type to fix a word.</div>`;
  box.hidden=false;
}
function closePicker(){$("#pick").hidden=true;pick.words=[];pick.order=[]}
$("#pick").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="pickClear"){pick.order=[];applyPick();renderPicker();return}
  if(b.id==="pickDone"){closePicker();$("#f-exp").focus();return}
  if(b.dataset.pw!==undefined){const i=+b.dataset.pw,k=pick.order.indexOf(i);if(k>=0)pick.order.splice(k,1);else pick.order.push(i);applyPick();renderPicker()}
});
$("#addForm").addEventListener("submit",()=>closePicker());

/* ---------- export ---------- */
function fileTag(){
  const parts=[];
  if(state.active!=="all")parts.push(state.active==="removed"?"removed":secName(state.active));
  if(state.status!=="all"&&state.active!=="removed")parts.push({bad:"expired",warn:"expiring-soon",good:"ok"}[state.status]);
  if(state.q.trim())parts.push("search-"+state.q.trim());
  return parts.map(s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")).filter(Boolean).join("-");
}
async function saveFile(fn,text,type){
  if(downloads){try{await downloads.save({filename:fn,data:text})}catch(_){hint("Download was cancelled.","")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function exportBarcodes(){
  const seen=new Set(),codes=[];
  visibleList().forEach(i=>{const c=String(i.barcode||"").trim();if(c&&!seen.has(c)){seen.add(c);codes.push(c)}});
  if(!codes.length){hint("No barcodes in this list.","err");return}
  const tag=fileTag();
  await saveFile(`barcodes-${tag?tag+"-":""}${todayStr()}.txt`,codes.join("\r\n")+"\r\n","text/plain");
  hint(`Saved ${codes.length} barcode${codes.length>1?"s":""}, one per line.`,"ok");
}
async function exportCsv(everything){
  const inRem=!everything&&state.active==="removed";
  const rows=[["Section","Description","Barcode","Expiry","Days left","Qty"].concat(inRem?["Removed on"]:[])];
  const src=everything?live():visibleList();
  const parts=[];
  if(!everything){
    if(state.active!=="all")parts.push(inRem?"removed":secName(state.active));
    if(state.status!=="all"&&!inRem)parts.push({bad:"expired",warn:"expiring-soon",good:"ok"}[state.status]);
    if(state.q.trim())parts.push("search-"+state.q.trim());
  }
  const tag=parts.map(s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")).filter(Boolean).join("-");
  [...src].sort((a,b)=>secName(a.section).localeCompare(secName(b.section))||(a.expiry||"").localeCompare(b.expiry||""))
    .forEach(i=>rows.push([secName(i.section),i.description,i.barcode,i.expiry,daysLeft(i.expiry),i.qty].concat(inRem?[String(i.removedAt).slice(0,10)]:[])));
  const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const fn=`stock-expiry-${tag?tag+"-":""}${todayStr()}.csv`;if(downloads){try{await downloads.save({filename:fn,data:csv});}catch(_){hint("Download was cancelled.","")}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- boot ---------- */
function startLocal(){
  state.mode="local";
  const saved=lsLoad();
  if(saved&&saved.sections){state.items=saved.items||[];state.sections=saved.sections}
  else{
    state.sections=DEFAULT_SECTIONS.slice();
    const t=new Date(),add=n=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
    state.items=[
      {id:uid(),barcode:"5000168001142",description:"Digestive biscuits 400g",section:"biscuits",expiry:add(45),qty:24,example:true},
      {id:uid(),barcode:"5010677015738",description:"Frozen garden peas 1kg",section:"frozen",expiry:add(5),qty:12,example:true},
      {id:uid(),barcode:"5000299225028",description:"Dish soap 500ml",section:"non-food",expiry:add(400),qty:30,example:true},
      {id:uid(),barcode:"6001108012345",description:"Lager beer 330ml can",section:"liquor",expiry:add(-3),qty:48,example:true}
    ];
    lsSave();
  }
  try{const r=JSON.parse(localStorage.getItem("sdk-remind")||"null");if(r&&Array.isArray(r.days))state.remind={days:r.days.map(Number)}}catch(_){}
  idbMirror();setTimeout(()=>checkAlertsNow(false),1500);
  $("#saveMode").textContent="Saved on this phone only. Tap Download CSV now and then to keep a backup.";
  render();
}
function startDb(){
  state.mode="db";
  $("#saveMode").textContent="Connecting…";
  let gotItems=false,gotSecs=false;
  const timer=setTimeout(()=>{if(!gotItems||!gotSecs)$("#saveMode").textContent="Can't reach your saved list yet. Check your connection."},10000);
  const done=()=>{if(gotItems&&gotSecs){clearTimeout(timer);$("#saveMode").textContent="Saved online. Open this page on any phone to see the same list."}};
  db.collection("sections").onSnapshot(s=>{
    state.sections=s.docs.map(d=>d.data());if(!s.metadata.fromCache){gotSecs=true;done()}
    render();
  },()=>{clearTimeout(timer);$("#saveMode").textContent="Lost connection to your saved list. Reload the page."});
  db.collection("items").onSnapshot(s=>{
    state.items=s.docs.map(d=>d.data());if(!s.metadata.fromCache){gotItems=true;done()}
    render();
  },()=>{clearTimeout(timer)});
  db.doc("settings/reminders").onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();if(d&&Array.isArray(d.days))state.remind={days:d.days.map(Number)}}
    renderDue();
  },()=>{});
}
render();
(async()=>{
  try{
    if(window.claude&&claude.use){
      const [d,dl,sm]=await Promise.all([claude.use("db"),claude.use("downloads"),claude.use("sample")]);
      db=d;downloads=dl;sampler=sm;
    }
  }catch(_){db=null}
  if(db)startDb();else startLocal();
  setupLabelReader();renderAiKey();
})();
setTimeout(()=>{if(state.mode==="loading"&&!db)startLocal()},11000);
})();
